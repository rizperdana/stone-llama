name: Bug report
description: stone-llama misbehaved — include doctor output and environment.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please search [existing issues](https://github.com/rizperdana/stone-llama/issues) first.

        Heads-up before filing: stone-llama is **CUDA-only** (ExLlamaV3). No NVIDIA GPU
        is not a bug — use [ollama](https://ollama.com) for GGUF/CPU models.

  - type: checkboxes
    id: preflight
    attributes:
      label: Checks before filing
      options:
        - label: I searched the existing issues and this is not already reported.
          required: true
        - label: I am on the latest release (or `main`) and the problem still happens.
          required: true

  - type: textarea
    id: version
    attributes:
      label: "stone-llama version and doctor output"
      description: >
        Run `stone-llama version` and `stone-llama doctor`, then paste both
        outputs. `doctor` checks GPU, driver, CUDA, disk and ports — most
        "bugs" turn out to be environment problems it already sees.
      render: shell
      placeholder: |
        $ stone-llama version
        stone-llama v...
        $ stone-llama doctor
        ...
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      description: Platform support matrix (see docs/RELEASE.md).
      options:
        - Linux/amd64 — supported, CI-tested
        - Linux/arm64 — builds, untested at runtime
        - Windows/amd64 — builds, untested at runtime
        - macOS (amd64/arm64) — builds, but can never serve (no CUDA); only version/--help/doctor work
        - Other
    validations:
      required: true

  - type: input
    id: gpu
    attributes:
      label: NVIDIA GPU, driver and CUDA version
      description: Required — stone-llama only runs on NVIDIA CUDA.
      placeholder: "RTX 3060 · driver 550.90.07 · CUDA 12.4"
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How did you install stone-llama?
      options:
        - install.sh (scripts/install.sh)
        - Release artifact (.tgz / .zip download)
        - Built from source (make build)
        - Other
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Actual behaviour, with the exact error text.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Exact commands from a clean state. If a model is involved, give the repo id + quant + size.
      render: shell
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs and additional context
      description: serve logs, terminal output, screenshots — anything that shows the failure.
      render: text
