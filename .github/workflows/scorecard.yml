name: Scorecard

# OpenSSF Scorecard supply-chain analysis (free for public repos). Advisory by
# design: it reports posture (branch protection, token permissions, pinned
# dependencies, secret scanning...) rather than a property of the PR, so it
# must never be a required check. publish_results enables the public badge.

on:
  push:
    branches: [main]
  schedule:
    - cron: '33 5 * * 1'

permissions:
  read-all

jobs:
  scorecard:
    name: scorecard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF to the security dashboard
      id-token: write        # signed, publishable results
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
