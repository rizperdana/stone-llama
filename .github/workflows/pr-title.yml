name: PR title

# The release-notes generator (gh release create --generate-notes) groups
# commits by these type prefixes, and squash-merged PRs land on main as a
# single commit whose message is the PR title. So the PR title must carry one
# of the prefixes the project actually uses: feat | fix | perf | docs | chore.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  conventional-title:
    name: conventional-title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            docs
            chore
          requireScope: false
