name: CodeQL

# Code scanning for Go. Public repos get this free (it would require GitHub
# Advanced Security if this repo were private). Same shape as the official
# template: PRs, main pushes, and a weekly run to catch new queries.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 4 * * 1'

jobs:
  codeql:
    name: codeql
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read        # for github/codeql-action/init to read workflow details
      security-events: write # upload SARIF results
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - uses: github/codeql-action/init@v4
        with:
          languages: go

      # go build ./... — zero third-party deps, so no network access needed.
      - uses: github/codeql-action/autobuild@v4

      - uses: github/codeql-action/analyze@v4
        with:
          category: '/language:go'
